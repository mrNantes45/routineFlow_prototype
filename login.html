<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | routineFLow</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body data-auth-mode="login">
    <main class="auth-shell">
        <p class="auth-brand">routineFLow</p>
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title">Welcome back</h1>
            <p class="auth-intro">Pick up where your routine left off.</p>
            <form class="auth-form" id="authForm">
                <label for="email">Email
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </label>
                <label for="password">Password
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </label>
                <p class="auth-message" id="authMessage" role="alert"></p>
                <button class="auth-submit" type="submit">Log in</button>
            </form>
            <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
            <p class="auth-note">Demo only: account data stays in this browser.</p>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>

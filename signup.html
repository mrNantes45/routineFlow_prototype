<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | routineFLow</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body data-auth-mode="signup">
    <main class="auth-shell">
        <p class="auth-brand">routineFLow</p>
        <section class="auth-card" aria-labelledby="signup-title">
            <h1 id="signup-title">Start your flow</h1>
            <p class="auth-intro">Create a local account for your daily routines.</p>
            <form class="auth-form" id="authForm">
                <label for="name">Name
                    <input id="name" name="name" type="text" autocomplete="name" required>
                </label>
                <label for="email">Email
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </label>
                <label for="password">Password
                    <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
                </label>
                <p class="auth-message" id="authMessage" role="alert"></p>
                <button class="auth-submit" type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            <p class="auth-note">Demo only: account data stays in this browser.</p>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
